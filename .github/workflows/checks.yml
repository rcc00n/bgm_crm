name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install declared check dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q accounts core notifications store booking
      - name: Run isolated source checks
        run: python ci/checks.py

  business-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.5
        env:
          POSTGRES_USER: ci_review
          POSTGRES_PASSWORD: synthetic-local-only
          POSTGRES_DB: review
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U ci_review -d review"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      REVIEW_POSTGRES: '1'
      REVIEW_POSTGRES_PORT: '5432'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install declared dependencies
        env:
          CFLAGS: -std=gnu17
        run: python -m pip install -r requirements.txt
      - name: Run isolated business regressions
        run: python ci/business_checks.py
